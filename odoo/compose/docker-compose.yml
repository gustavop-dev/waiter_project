# Odoo como motor de POS de ProjectApp Smart Restaurant.
#
# Los puertos se atan a la interfaz host-only de VirtualBox: el navegador corre
# en la maquina anfitriona, no dentro de la VM.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:19
    depends_on:
      - db
    ports:
      - "192.168.56.10:8069:8069"
      - "192.168.56.10:8072:8072"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ../addons:/mnt/extra-addons:ro

volumes:
  db-data:
  odoo-data:
