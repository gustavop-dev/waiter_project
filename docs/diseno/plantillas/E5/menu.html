<!-- E5 · Flight de degustación · menu -->
<div style="height: 520px; border-radius: 20px; background: #14120F; border: 1px solid #2C2823; overflow: hidden; display: flex; flex-direction: column; color: #EDE7DD;">
          <div style="padding: 20px; border-bottom: 1px solid #2C2823;"><div style="font-size: 20px; font-weight: 700;">Arma tu flight</div><div style="font-size: 14px; color: #8F877D; margin-top: 2px;">Cuatro tercios · 32.000</div></div>
          <div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; gap: 8px; margin-bottom: 4px;">
              <span style="flex: 1; min-height: 0; overflow: hidden; height: 46px; border-radius: 10px; background: #C1873A; color: #1A1815; display: grid; place-items: center; font-size: 14px; font-weight: 700;">Golden</span>
              <span style="flex: 1; min-height: 0; overflow: hidden; height: 46px; border-radius: 10px; background: #C1873A; color: #1A1815; display: grid; place-items: center; font-size: 14px; font-weight: 700;">IPA</span>
              <span style="flex: 1; min-height: 0; overflow: hidden; height: 46px; border-radius: 10px; border: 1px dashed #3A342E; color: #8F877D; display: grid; place-items: center; font-size: 14px;">＋</span>
              <span style="flex: 1; min-height: 0; overflow: hidden; height: 46px; border-radius: 10px; border: 1px dashed #3A342E; color: #8F877D; display: grid; place-items: center; font-size: 14px;">＋</span>
            </div>
            <div style="font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #7C736A; font-weight: 500;">Añade dos más</div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-radius: 12px; background: #1C1916;"><span style="font-size: 15px;">Roja irlandesa</span><span style="width: 32px; height: 32px; border-radius: 999px; border: 1px solid #3A342E; display: grid; place-items: center; font-size: 16px; color: #C4BCB2;">＋</span></div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-radius: 12px; background: #1C1916;"><span style="font-size: 15px;">Stout de café</span><span style="width: 32px; height: 32px; border-radius: 999px; border: 1px solid #3A342E; display: grid; place-items: center; font-size: 16px; color: #C4BCB2;">＋</span></div>
            <div style="margin-top: auto; font-size: 13px; line-height: 1.45; color: #8F877D;">Se sirven de la más ligera a la más oscura, en ese orden.</div>
          </div>
          <div style="padding: 14px 20px; border-top: 1px solid #2C2823;"><div style="height: 56px; border-radius: 12px; background: #2C2823; color: #8F877D; display: grid; place-items: center; font-size: 16px; font-weight: 700;">Faltan 2 para pedir</div></div>
        </div>
<p style="max-width: 360px; font-size: 14px; line-height: 1.45; color: #6B6259;">Selección con huecos visibles y botón bloqueado hasta completar. Enseña a pedir sin explicar reglas.</p>
