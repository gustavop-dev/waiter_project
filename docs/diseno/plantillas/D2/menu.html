<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="design_doc_mode" content="canvas" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #EDE9E1; font-family: "Ubuntu", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #A06E2C; text-decoration: none; }
  a:hover { color: #7A5320; }
  * { box-sizing: border-box; }
</style>
</head>
<body style="padding: 24px; background: #EDE9E1;">
<!-- D2 · Constructor de bebida · menu -->
<div style="height: 520px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DDD6C9; overflow: hidden; display: flex; flex-direction: column;">
          <div style="padding: 18px 20px; border-bottom: 1px solid #EFE9E0;"><div style="font-size: 21px; font-weight: 700;">Latte</div><div style="font-size: 14px; color: #7A7166; margin-top: 2px;">Personalízalo como siempre</div></div>
          <div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px;">
            <div>
              <div style="font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #9A8F7E; font-weight: 500; margin-bottom: 8px;">Tamaño</div>
              <div style="display: flex; gap: 8px;">
                <span style="flex: 1; min-height: 0; overflow: hidden; height: 50px; border-radius: 10px; border: 1px solid #E4DED4; display: grid; place-items: center; font-size: 15px;">8 oz</span>
                <span style="flex: 1; min-height: 0; overflow: hidden; height: 50px; border-radius: 10px; background: #1A1815; color: #FFFFFF; display: grid; place-items: center; font-size: 15px; font-weight: 500;">12 oz</span>
                <span style="flex: 1; min-height: 0; overflow: hidden; height: 50px; border-radius: 10px; border: 1px solid #E4DED4; display: grid; place-items: center; font-size: 15px;">16 oz</span>
              </div>
            </div>
            <div>
              <div style="font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #9A8F7E; font-weight: 500; margin-bottom: 8px;">Leche</div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <span style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #E4DED4; display: grid; place-items: center; font-size: 15px;">Entera</span>
                <span style="height: 44px; padding: 0 14px; border-radius: 999px; background: #FDF6EA; border: 2px solid #C1873A; display: grid; place-items: center; font-size: 15px; font-weight: 500;">Avena +2.000</span>
                <span style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #E4DED4; display: grid; place-items: center; font-size: 15px;">Almendra</span>
              </div>
            </div>
            <div>
              <div style="font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #9A8F7E; font-weight: 500; margin-bottom: 8px;">Extras</div>
              <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; border: 1px solid #E4DED4;"><span style="font-size: 15px;">Shot extra</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #6B6259;">+2.500</span></div>
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; border: 1px solid #E4DED4;"><span style="font-size: 15px;">Sirope de vainilla</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #6B6259;">+1.500</span></div>
              </div>
            </div>
          </div>
          <div style="padding: 14px 20px; border-top: 1px solid #EFE9E0; display: flex; gap: 10px; align-items: center;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px;">11.000</span>
            <span style="flex: 1; min-height: 0; overflow: hidden; height: 56px; border-radius: 12px; background: #C1873A; color: #FFFFFF; display: grid; place-items: center; font-size: 16px; font-weight: 700;">Añadir</span>
          </div>
        </div>
<p style="max-width: 360px; font-size: 14px; line-height: 1.45; color: #6B6259;">Tamaño, leche y extras con recargo visible. Guarda la última combinación para el siguiente pedido.</p>
</body></html>
